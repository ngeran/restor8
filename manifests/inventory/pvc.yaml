# SQLite volume for inventory. k3s ships local-path as the default class —
# a hostPath-backed bind is exactly right for a single-node lab.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restor8-inventory
  namespace: restor8
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
