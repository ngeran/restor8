# restor8-connector Deployment.
#
# image + imagePullPolicy match the justfile push target (localhost:5000).
# Always is required: the tag is fixed (:latest) and re-pushed, so Always
# forces k3s to fetch the newest digest each rollout.
#
# Credential envs: LAB_USER/LAB_PASSWORD (Secret restor8/lab-auth) are the
# default pair; every additional Secret is injected as
# LAB_AUTH_<REF>_USER/_PASSWORD so requests can pick one via `auth_ref`
# (inventory's auth_ref column: P-1 → lab-auth, the clab nodes →
# lab-auth-root). `optional: true` so the pod starts even before a Secret
# exists; requests then 422 until it does.
#
# Safe-by-default: non-root (UID 1000, matches flake.nix config.User),
# read-only root fs (emptyDir /tmp for temp writes), all capabilities
# dropped, no privilege escalation, seccomp=RuntimeDefault, resource
# limits, and /healthz probes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restor8-connector
  namespace: restor8
  labels:
    app: restor8-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restor8-connector
  template:
    metadata:
      labels:
        app: restor8-connector
    spec:
      serviceAccountName: restor8-connector   # live credential profiles (rbac.yaml)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restor8-connector
          image: localhost:5000/restor8-connector:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_URL
              value: http://restor8-gateway:8080
            - name: LAB_USER
              valueFrom:
                secretKeyRef:
                  name: lab-auth
                  key: LAB_USER
                  optional: true
            - name: LAB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-auth
                  key: LAB_PASSWORD
                  optional: true
            - name: LAB_AUTH_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: lab-auth-root
                  key: LAB_USER
                  optional: true
            - name: LAB_AUTH_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-auth-root
                  key: LAB_PASSWORD
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
