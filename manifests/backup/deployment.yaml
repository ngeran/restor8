# restor8-backup Deployment.
#
# The Git history repo lives on a PVC (1Gi, local-path) at /data/repo —
# this is the "config-as-history" store Phase 3 restore and Phase 7's
# diff/revert UI read from. No credential env: connector owns creds.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restor8-backup
  namespace: restor8
  labels:
    app: restor8-backup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restor8-backup
  template:
    metadata:
      labels:
        app: restor8-backup
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restor8-backup
          image: localhost:5000/restor8-backup:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INVENTORY_URL
              value: http://restor8-inventory:8080
            - name: CONNECTOR_URL
              value: http://restor8-connector:8080
            - name: BACKUP_REPO
              value: /data/repo
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: restor8-backup
