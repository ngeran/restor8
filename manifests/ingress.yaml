# restor8 Ingress — via k3s's Traefik.
#
#   http://restor8.home            → the SPA (frontend)
#   http://restor8.home/api/*, /ws → the gateway (same origin — no CORS,
#                                    WS included)
#   http://connector.restor8.home / inventory.restor8.home → service docs
#
# Hostnames need /etc/hosts (or LAN DNS) → this node.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restor8
  namespace: restor8
spec:
  rules:
    - host: restor8.home
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: restor8-gateway
                port: { name: http }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: restor8-gateway
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restor8-frontend
                port: { name: http }
    - host: connector.restor8.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restor8-connector
                port: { name: http }
    - host: inventory.restor8.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restor8-inventory
                port: { name: http }
