# restor8-gateway Deployment. Stateless; the event bus is in-memory
# (a reconnecting browser resubscribes — runs are re-readable via REST).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restor8-gateway
  namespace: restor8
  labels:
    app: restor8-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restor8-gateway
  template:
    metadata:
      labels:
        app: restor8-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restor8-gateway
          image: localhost:5000/restor8-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INVENTORY_URL
              value: http://restor8-inventory:8080
            - name: CONNECTOR_URL
              value: http://restor8-connector:8080
            - name: BACKUP_URL
              value: http://restor8-backup:8080
            - name: RESTORE_URL
              value: http://restor8-restore:8080
            - name: TOPOLOGY_URL
              value: http://restor8-topology:8080
            - name: SCENARIO_URL
              value: http://restor8-scenario:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
