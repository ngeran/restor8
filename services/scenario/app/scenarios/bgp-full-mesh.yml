# bgp-full-mesh — the first scenario, end to end before any generalization.
#
# eBGP full mesh across every planned node, peering on the flat pod-network
# underlay (eth0 pod IPs — discovered live through connector, since pod IPs
# are not stable enough to store). Each node peers with every other node's
# pod IP using the peer's plan ASN, and exports direct routes so sessions
# actually carry prefixes.
name: bgp-full-mesh
description: eBGP full mesh over the flat pod-network underlay

template: templates/bgp-full-mesh.j2
jsnapy_test: jsnapy_tests/bgp/bgp.yml

convergence_timeout: 150   # seconds polling for all-peers-Established
poll_interval: 5
min_peers: 9               # 10-node mesh → 9 peers each; guards vacuous pass

# Which planned nodes participate (roles from the topology service's plan).
node_roles: [P, PE, RR, CE]

vars:
  group: MESH
